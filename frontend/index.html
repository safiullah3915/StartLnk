<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Base SEO fallback — overridden per-page by react-helmet-async -->
    <title>StartLnk — Startup Collaboration, Internships & Opportunities</title>
    <meta name="description" content="StartLnk is Pakistan's leading startup collaboration ecosystem. Connect with founders, join startup teams, discover internships, remote jobs, and startup opportunities." />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="StartLnk" />
    <meta name="theme-color" content="#25224A" />

    <!--
      NOTE: No <meta name="keywords"> tag.
      Keywords meta is deprecated by Google, Bing, and all major engines.
      Its presence can signal low-quality SEO practices.
    -->

    <!--
      NOTE: No root-level JSON-LD schema here.
      All structured data is injected per-page via react-helmet-async <SEOHead>.
      This prevents duplicate/conflicting/stale schema definitions.
    -->

    <!--
      NOTE: No root-level canonical tag here.
      Canonical is injected dynamically per-page to avoid pointing all pages
      to the homepage URL. react-helmet-async handles this.
    -->

    <!-- Open Graph base (overridden per-page) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="StartLnk" />
    <meta property="og:locale" content="en_US" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
