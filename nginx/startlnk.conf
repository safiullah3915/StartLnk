upstream django_backend {
    server unix:/run/gunicorn.sock fail_timeout=0;
}

server {
    server_name startlnk.xyz www.startlnk.xyz 64.227.180.47;

    access_log /var/log/nginx/startlnk_access.log;
    error_log  /var/log/nginx/startlnk_error.log warn;

    # React SPA build directory
    root /home/safi/safi/StartLnk/frontend/dist;
    index index.html;

    client_max_body_size 20M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        application/manifest+json image/svg+xml font/woff2;

    # Security headers
    add_header X-Content-Type-Options  "nosniff"       always;
    add_header X-Frame-Options         "DENY"          always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # Vite hashed assets - cache 1 year (hash changes on every deploy)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Django admin static files
    location /static/ {
        alias /home/safi/safi/StartLnk/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # User upload media files
    location /media/ {
        alias /home/safi/safi/StartLnk/backend/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
        location ~* \.(php|py|pl|sh|cgi|exe)$ { return 403; }
    }

    # robots.txt - served from React dist/
    location = /robots.txt {
        try_files $uri =404;
        expires 1d;
        access_log off;
    }

    # Sitemap index - generated by Django backend
    location = /sitemap.xml {
        proxy_pass http://django_backend;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Sitemap sub-files (sitemap-static.xml, sitemap-startups.xml, etc.)
    # Must be explicit or they fall through to the SPA catch-all and return index.html
    location ~ ^/sitemap-.+\.xml$ {
        proxy_pass http://django_backend;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        add_header Content-Type "application/xml; charset=utf-8";
    }

    # Django API
    location /api/ {
        proxy_pass http://django_backend;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout  60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
        proxy_buffering         on;
        proxy_buffer_size       8k;
        proxy_buffers           8 8k;
        proxy_busy_buffers_size 16k;
    }

    # Django auth endpoints
    location /auth/ {
        proxy_pass http://django_backend;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_connect_timeout  60s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # React signup page on browser refresh, Django signup API on POST
    location = /signup {
        if ($request_method = GET) {
            rewrite ^ /index.html last;
        }

        proxy_pass http://django_backend;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Root-level Django validation endpoints used during signup
    location = /check-email {
        proxy_pass http://django_backend;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    location = /check-username {
        proxy_pass http://django_backend;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Backend account-token endpoint only, not React /account page
    location ~ ^/account/.+ {
        proxy_pass http://django_backend;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Django admin panel
    location /admin/ {
        proxy_pass http://django_backend;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # React SPA catch-all - critical for React Router refresh/direct URLs
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires 0;
    }

    location = /favicon.ico {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/startlnk.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/startlnk.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.startlnk.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = startlnk.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name startlnk.xyz www.startlnk.xyz 64.227.180.47;
    return 404; # managed by Certbot
}
